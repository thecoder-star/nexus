<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: system-ui; }
        .debug-panel { background: #1e293b; border: 1px solid #3b82f6; padding: 10px; margin-bottom: 20px; border-radius: 8px; font-family: monospace; font-size: 12px; }
        .game-card { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; transition: 0.2s; }
        .game-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-black text-blue-500 mb-4">NEXUS SYSTEM</h1>

        <div class="debug-panel">
            <p class="text-blue-400 font-bold mb-2 uppercase">[ System Log ]</p>
            <div id="log">Waiting for games.js to report in...</div>
        </div>

        <div id="content">
            <div id="games" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                </div>
        </div>
        <div id="game-container" style="display:none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <script>
        const logEl = document.getElementById('log');
        
        function updateLog(msg, color = "text-white") {
            logEl.innerHTML += `<div class="${color} mt-1">> ${msg}</div>`;
        }

        window.addEventListener('load', () => {
            updateLog("Window loaded. Checking window.games...", "text-yellow-400");

            // 1. Check if the variable even exists
            if (typeof window.games === 'undefined') {
                updateLog("ERROR: 'window.games' is undefined. The CDN script might be blocked or empty.", "text-red-500");
                return;
            }

            // 2. Inspect the data structure
            updateLog(`Data detected! Type: ${typeof window.games}`);
            console.log("Full Game Data:", window.games); // Check your F12 console!

            let gameList = [];

            // 3. Attempt to find the list inside the data
            if (Array.isArray(window.games)) {
                gameList = window.games;
                updateLog(`Success: Found array with ${gameList.length} games.`, "text-green-400");
            } else if (window.games.games && Array.isArray(window.games.games)) {
                gameList = window.games.games;
                updateLog(`Success: Found nested array with ${gameList.length} games.`, "text-green-400");
            } else {
                updateLog("CRITICAL: Data structure is not an array. Check console (F12) to see the object.", "text-red-500");
                logEl.innerHTML += `<pre class="bg-black p-2 mt-2 text-pink-400">${JSON.stringify(window.games, null, 2).substring(0, 300)}...</pre>`;
                return;
            }

            // 4. Render the games
            const container = document.getElementById('games');
            container.innerHTML = ''; 

            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card p-3 cursor-pointer';
                card.innerHTML = `
                    <img src="${game.image || game.thumb || ''}" class="w-full aspect-video object-cover rounded mb-2" onerror="this.src='https://placehold.co/300x169?text=No+Image'">
                    <div class="font-bold text-sm truncate">${game.name || 'Unknown Game'}</div>
                `;
                card.onclick = () => {
                    alert("Launching: " + (game.url || "No URL found"));
                    if(game.url) window.location.href = game.url;
                };
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
