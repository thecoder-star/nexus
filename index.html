<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Unblocked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #020617; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        iframe { background: white; }
    </style>
</head>
<body class="p-8">

    <header class="max-w-7xl mx-auto mb-12">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">NEXUS</h1>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="games" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div id="loading-state" class="col-span-full text-center py-20 opacity-50">
                <p>Initializing Game Engine...</p>
            </div>
        </div>
    </main>

    <div id="game-view" class="fixed inset-0 z-50 bg-black hidden flex-col">
        <div class="p-4 flex justify-between bg-slate-900">
            <span id="game-title" class="font-bold">Loading...</span>
            <button onclick="document.getElementById('game-view').classList.add('hidden')" class="text-red-400">CLOSE</button>
        </div>
        <iframe id="game-frame" src="" class="w-full h-full border-none"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <script>
        // Use a small delay to let the external games.js finish its internal setup
        window.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading-state');
            
            // Check if the script successfully loaded the 'games' array
            if (window.games) {
                loading.classList.add('hidden');
                renderLocalGames(window.games);
            } else {
                loading.innerHTML = "Error: Game data not found. Try hosting on GitHub Pages.";
            }
        });

        function renderLocalGames(list) {
            const container = document.getElementById('games');
            container.innerHTML = ''; // Clear loading message
            
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'glass p-4 rounded-xl cursor-pointer hover:scale-105 transition-transform';
                card.innerHTML = `
                    <img src="${game.image}" class="rounded mb-2 w-full aspect-video object-cover" onerror="this.src='https://placehold.co/400x225?text=Game'">
                    <h3 class="font-bold">${game.name}</h3>
                `;
                card.onclick = () => {
                    const view = document.getElementById('game-view');
                    const frame = document.getElementById('game-frame');
                    document.getElementById('game-title').innerText = game.name;
                    view.classList.remove('hidden');
                    view.classList.add('flex');
                    frame.src = game.url;
                };
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
