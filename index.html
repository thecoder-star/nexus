<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Unblocked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: white;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .game-card img {
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 8px;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tighter bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                NEXUS UNBLOCKED
            </h1>
            <p class="text-slate-400 text-sm">Powered by Scramjet Architecture</p>
        </div>
        
        <div class="relative w-full md:w-96">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
            <input type="text" id="search" placeholder="Search games..." 
                class="w-full bg-slate-900/50 border border-slate-700 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full flex flex-col items-center py-20 opacity-50" id="loading">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-blue-500 mb-4"></div>
                <p>Fetching games from CDN...</p>
            </div>
        </div>
    </main>

    <div id="game-container" class="fixed inset-0 z-50 bg-black/95 hidden flex-col">
        <div class="flex justify-between items-center p-4 bg-slate-900">
            <h2 id="current-game-title" class="font-bold text-xl text-blue-400">Game View</h2>
            <button onclick="closeGame()" class="p-2 hover:bg-white/10 rounded-full transition">
                <i data-lucide="x" class="w-8 h-8"></i>
            </button>
        </div>
        <iframe id="game-iframe" src="" class="w-full h-full border-none"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gn-math.github.io-main@1.0.5/"></script>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const gameGrid = document.getElementById('game-grid');
        const searchInput = document.getElementById('search');
        const loading = document.getElementById('loading');
        
        // This is where we handle the data from your games.js
        // Assuming the file populates a global variable like 'games' or 'allGames'
        async function initPortal() {
            try {
                // In many ugs-singlefile builds, the games are stored in window.games
                const gamesList = window.games || [];
                
                if (gamesList.length === 0) {
                    loading.innerHTML = "<p>No games found. Check the console for script errors.</p>";
                    return;
                }

                loading.classList.add('hidden');
                renderGames(gamesList);

                // Search Logic
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = gamesList.filter(g => 
                        g.name.toLowerCase().includes(term) || 
                        (g.description && g.description.toLowerCase().includes(term))
                    );
                    renderGames(filtered);
                });

            } catch (err) {
                console.error("Portal Error:", err);
            }
        }

        function renderGames(list) {
            gameGrid.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'glass p-4 rounded-2xl cursor-pointer group';
                card.onclick = () => launchGame(game.url, game.name);
                
                card.innerHTML = `
                    <img src="${game.image || 'https://images.unsplash.com/photo-1550745165-9bc0b252729f?auto=format&fit=crop&q=80&w=400'}" alt="${game.name}" class="mb-4">
                    <h3 class="font-bold text-lg group-hover:text-blue-400 transition-colors">${game.name}</h3>
                    <p class="text-xs text-slate-500 mt-1 uppercase tracking-widest">${game.category || 'General'}</p>
                `;
                gameGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        function launchGame(url, title) {
            const container = document.getElementById('game-container');
            const iframe = document.getElementById('game-iframe');
            document.getElementById('current-game-title').innerText = title;
            
            // Proxy Implementation Logic:
            // Since this is static, we use the URL directly.
            // If you deploy a Scramjet/Ultraviolet backend, you would change this to:
            // iframe.src = "/service/" + btoa(url);
            iframe.src = url; 
            
            container.classList.remove('hidden');
            container.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            const container = document.getElementById('game-container');
            const iframe = document.getElementById('game-iframe');
            iframe.src = '';
            container.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Run after scripts load
        window.onload = initPortal;
    </script>
</body>
</html>
