<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Unblocked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #game-area { display: none; position: fixed; inset: 0; background: black; z-index: 100; flex-direction: column; }
    </style>
</head>
<body class="p-8">

    <h1 class="text-3xl font-bold text-blue-500 mb-8 uppercase tracking-tighter">Nexus Portal</h1>

    <div id="games" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <p id="status" class="col-span-full text-slate-500">Connecting to game database...</p>
    </div>

    <div id="game-area">
        <div class="p-4 bg-slate-900 flex justify-between">
            <span id="active-title" class="font-bold"></span>
            <button onclick="closeGame()" class="text-red-500 font-bold">CLOSE</button>
        </div>
        <iframe id="game-frame" class="w-full h-full border-none"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <script>
        function renderLocalGames(data) {
            const container = document.getElementById('games');
            const status = document.getElementById('status');
            
            // ERROR FIX: Check if data is an array. 
            // If it's an object, we look for a 'games' property inside it.
            let list = [];
            if (Array.isArray(data)) {
                list = data;
            } else if (data && Array.isArray(data.games)) {
                list = data.games;
            } else {
                console.error("Data structure not recognized:", data);
                status.innerText = "Error: Invalid game data format.";
                return;
            }

            status.style.display = 'none';
            container.innerHTML = ''; 

            list.forEach(game => {
                const div = document.createElement('div');
                div.className = 'glass p-3 rounded-lg cursor-pointer hover:scale-105 transition-all border-none';
                div.innerHTML = `
                    <img src="${game.image}" class="w-full aspect-video object-cover rounded mb-2" onerror="this.src='https://placehold.co/300x169?text=Game'">
                    <div class="font-semibold text-sm truncate">${game.name}</div>
                `;
                div.onclick = () => {
                    document.getElementById('game-area').style.display = 'flex';
                    document.getElementById('game-frame').src = game.url;
                    document.getElementById('active-title').innerText = game.name;
                };
                container.appendChild(div);
            });
        }

        function closeGame() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }

        // Wait for both the page and the external script to finish
        window.addEventListener('load', () => {
            if (window.games) {
                renderLocalGames(window.games);
            } else {
                document.getElementById('status').innerText = "Database offline.";
            }
        });
    </script>
</body>
</html>
